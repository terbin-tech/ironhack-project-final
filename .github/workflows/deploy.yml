name: deploy

on:
  push:
    branches: [main]
    paths:
      - expensy_frontend/**
      - Dockerfile.frontend
      - expensy_backend/**
      - Dockerfile.backend
      - certs/**
  workflow_dispatch:

permissions: {}

# queue: max keeps every pending run instead of dropping all but the newest,
# so each push gets its own images and tag commit. cancel-in-progress cannot
# be combined with it.
concurrency:
  group: deploy-main
  queue: max

env:
  AWS_REGION: us-east-1
  KUSTOMIZATION: gitops/apps/expensy/kustomization.yaml

jobs:
  # A CI failure on the same commit stops the deploy before any image is built.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  changes:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      services: ${{ steps.diff.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          paths='{"frontend":["expensy_frontend/","Dockerfile.frontend"],"backend":["expensy_backend/","Dockerfile.backend","certs/"]}'
          if [ "$EVENT_NAME" = workflow_dispatch ] \
            || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
            || ! files=$(git diff --name-only "$BEFORE" "$SHA"); then
            services=$(jq -c 'keys' <<< "$paths")
          else
            services=$(jq -c --arg files "$files" \
              'to_entries | map(select(.value as $prefixes | $files | split("\n") | any(. as $f | $prefixes | any(. as $p | $f | startswith($p))))) | map(.key)' \
              <<< "$paths")
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Build and push unless the tag exists
        env:
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          repository="martin-expensy-$SERVICE"
          if aws ecr describe-images --repository-name "$repository" \
            --image-ids "imageTag=$SHA" > /dev/null 2>&1; then
            echo "$repository:$SHA already exists, skipping the build"
            exit 0
          fi
          args=()
          if [ "$SERVICE" = frontend ]; then
            args=(--build-arg NEXT_PUBLIC_API_URL=https://martin.diogo.world)
          fi
          docker buildx build --platform linux/amd64 -f "Dockerfile.$SERVICE" "${args[@]}" \
            -t "$REGISTRY/$repository:$SHA" --push .

  # The deploy: Argo CD applies whatever this job records, so it waits for the
  # production environment's reviewer.
  record-tags:
    needs: [changes, build]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_RECORD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      # The digest goes next to the tag, so the pods run exactly the image that was pushed.
      - name: Record the new tags and digests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVICES: ${{ needs.changes.outputs.services }}
          SHA: ${{ github.sha }}
          QUERY: |
            mutation($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) { commit { oid url } }
            }
        run: |
          set -euo pipefail
          headline="ci: deploy $(jq -r 'join(", ")' <<< "$SERVICES") at ${SHA::7}"
          original="$RUNNER_TEMP/original.yaml"
          updated="$RUNNER_TEMP/kustomization.yaml"
          digests="$RUNNER_TEMP/digests"
          for service in $(jq -r '.[]' <<< "$SERVICES"); do
            digest=$(aws ecr describe-images --repository-name "martin-expensy-$service" \
              --image-ids "imageTag=$SHA" --query 'imageDetails[0].imageDigest' --output text)
            [[ $digest == sha256:* ]] || { echo "no digest for martin-expensy-$service:$SHA" >&2; exit 1; }
            echo "martin-expensy-$service $digest" >> "$digests"
          done
          for attempt in 1 2 3 4 5; do
            head=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$REPO/contents/$KUSTOMIZATION?ref=$head" > "$original"
            cp "$original" "$updated"
            while read -r name digest; do
              NAME=$name yq -e '.images[] | select(.name == strenv(NAME))' "$updated" > /dev/null \
                || { echo "$KUSTOMIZATION has no images entry for $name" >&2; exit 1; }
              NAME=$name DIGEST=$digest yq -i \
                '(.images[] | select(.name == strenv(NAME))) |= (.newTag = strenv(SHA) | .digest = strenv(DIGEST))' \
                "$updated"
            done < "$digests"
            if cmp -s "$original" "$updated"; then
              echo "$KUSTOMIZATION already has these tags at $head, nothing to commit"
              exit 0
            fi
            body=$(jq -n --arg query "$QUERY" --arg repo "$REPO" --arg head "$head" \
              --arg headline "$headline" --arg path "$KUSTOMIZATION" \
              --arg contents "$(base64 -w0 "$updated")" \
              '{query: $query, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                expectedHeadOid: $head,
                message: {headline: $headline},
                fileChanges: {additions: [{path: $path, contents: $contents}]}
              }}}')
            if out=$(gh api graphql --input - <<< "$body" 2>&1); then
              echo "$out"
              exit 0
            fi
            if [ "$attempt" -lt 5 ] && grep -qE 'STALE_DATA|Expected branch to point to' <<< "$out"; then
              echo "main moved past $head, retrying ($attempt of 5)"
              continue
            fi
            echo "$out" >&2
            exit 1
          done
