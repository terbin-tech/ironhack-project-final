apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: expensy
  namespace: expensy
  # ExternalDNS reads only routes with this label
  labels:
    app.kubernetes.io/part-of: expensy
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - martin.diogo.world
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
