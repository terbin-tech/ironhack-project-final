apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: expensy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: expensy
  annotations:
    # After the docdb-user Job (wave 1)
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: expensy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: expensy
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # minDomains keeps a pod pending until Auto Mode adds a node in the empty zone.
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: frontend
          image: martin-expensy-frontend
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 100m
              # Equal to the limit, so the scheduler counts what the pod may use
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The Next.js server writes its cache here
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: expensy
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: expensy
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: expensy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
