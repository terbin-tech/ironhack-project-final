apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - frontend.yaml
  - backend.yaml
  - routes.yaml
  - network-policies.yaml
  - docdb-user-job.yaml
configMapGenerator:
  - name: docdb-create-user
    namespace: expensy
    files:
      - create-user.js
# No registry: the expensy Application adds it and keeps these tags and digests.
images:
  - name: martin-expensy-frontend
    newTag: pending
  - name: martin-expensy-backend
    newTag: pending
