apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: expensy
  annotations:
    # After the docdb-user Job (wave 1)
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: expensy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: expensy
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # minDomains keeps a pod pending until Auto Mode adds a node in the empty zone.
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: backend
          image: martin-expensy-backend
          ports:
            - name: http
              containerPort: 8706
          envFrom:
            - configMapRef:
                name: expensy-config
          env:
            - name: DB_USERNAME_FILE
              value: /mnt/secrets/db-username
            - name: DB_PASSWORD_FILE
              value: /mnt/secrets/db-password
            - name: REDIS_PASSWORD_FILE
              value: /mnt/secrets/redis-password
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              # Equal to the limit, so the scheduler counts what the pod may use
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: expensy-backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: expensy
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: expensy
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: expensy
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: expensy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
